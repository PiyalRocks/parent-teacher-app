{% extends "base.html" %}{% block body %}
<div class="col-md-5 card card-body"><h4>My profile</h4><p class="text-muted">{{current_user.email}} · {{current_user.role}}</p>
<form method="post"><input class="form-control mb-2" name="name" value="{{current_user.name}}" required>
<input class="form-control mb-3" name="password" type="password" placeholder="New password (optional)" minlength="6">
<button class="btn btn-primary">Save profile</button></form></div>{% endblock %}
