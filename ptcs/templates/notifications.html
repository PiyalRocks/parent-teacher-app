{% extends "base.html" %}{% block body %}<h3>Notifications</h3>
<ul class="list-group">{% for t,c,seen in items %}<li class="list-group-item {{'fw-bold' if not seen}}">{{t}} <small class="text-muted float-end">{{c.strftime('%d %b %H:%M')}}</small></li>
{% else %}<li class="list-group-item text-muted">Nothing new.</li>{% endfor %}</ul>{% endblock %}
